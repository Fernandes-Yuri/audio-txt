name: Build APK

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma e build-tools
        run: |
          yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Baixar runtime Sherpa-onnx (AAR)
        run: |
          mkdir -p app/libs
          curl -L -s https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.40/sherpa-onnx-1.10.40.aar -o app/libs/sherpa-onnx.aar

      - name: Baixar modelo Whisper Tiny PT (Assets)
        run: |
          mkdir -p app/src/main/assets/whisper-tiny
          curl -L -s https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-encoder.int8.onnx -o app/src/main/assets/whisper-tiny/tiny-encoder.int8.onnx
          curl -L -s https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-decoder.int8.onnx -o app/src/main/assets/whisper-tiny/tiny-decoder.int8.onnx
          curl -L -s https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-tokens.txt -o app/src/main/assets/whisper-tiny/tiny-tokens.txt

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: audio-txt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
