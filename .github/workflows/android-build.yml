name: Build APK

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma e build-tools
        run: |
          yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: audio-txt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
